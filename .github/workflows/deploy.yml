name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only public/ is published; everything else in the repository is tooling.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs collapse to the latest, but a running
# deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        # Full history: the man page date comes from the last commit touching
        # public/, and a shallow clone cannot answer that. See
        # scripts/set-build-date.py.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set man page date
        run: python3 scripts/set-build-date.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload public/
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
